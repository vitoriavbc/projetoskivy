<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas Personalizada</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        
        .container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            padding: 30px;
        }
        
        h2 {
            color: #5a67d8;
            margin-bottom: 20px;
            text-align: center;
            font-size: 28px;
        }
        
        .input-group {
            display: flex;
            margin-bottom: 25px;
        }
        
        #tarefa {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px 0 0 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        #tarefa:focus {
            outline: none;
            border-color: #5a67d8;
        }
        
        button {
            background-color: #5a67d8;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #4c51bf;
        }
        
        #lista {
            margin-top: 20px;
            padding: 0;
        }
        
        li {
            list-style: none;
            margin: 10px 0;
            padding: 15px;
            background: #f7fafc;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        li:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .remover {
            background-color: #e53e3e;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        
        .remover:hover {
            background-color: #c53030;
        }
        
        .tarefa-texto {
            flex: 1;
            margin-right: 10px;
        }
        
        .vazio {
            text-align: center;
            color: #718096;
            font-style: italic;
            padding: 20px;
        }
        
        .contador {
            margin-top: 15px;
            text-align: center;
            color: #718096;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Minha Lista de Tarefas</h2>
        
        <div class="input-group">
            <input type="text" id="tarefa" placeholder="Digite uma tarefa...">
            <button onclick="adicionarTarefa()">Adicionar</button>
        </div>
        
        <ul id="lista">
            <li class="vazio">Nenhuma tarefa adicionada ainda</li>
        </ul>
        
        <div class="contador" id="contador">Total de tarefas: 0</div>
    </div>

    <script>
        function adicionarTarefa() {
            let input = document.getElementById("tarefa");
            let valor = input.value.trim();

            // Verifica se o campo está vazio
            if (valor === "") {
                alert("Digite uma tarefa!");
                return;
            }

            // Remove a mensagem de lista vazia se existir
            let lista = document.getElementById("lista");
            let primeiroItem = lista.firstElementChild;
            if (primeiroItem && primeiroItem.classList.contains("vazio")) {
                lista.removeChild(primeiroItem);
            }

            // Cria o novo item da lista
            let li = document.createElement("li");
            
            // Cria o texto da tarefa
            let tarefaTexto = document.createElement("span");
            tarefaTexto.className = "tarefa-texto";
            tarefaTexto.innerText = valor;
            
            // Cria o botão remover
            let botaoRemover = document.createElement("button");
            botaoRemover.className = "remover";
            botaoRemover.innerText = "Remover";
            botaoRemover.onclick = function() {
                li.remove();
                atualizarContador();
                
                // Se não houver mais tarefas, mostra mensagem de lista vazia
                if (lista.children.length === 0) {
                    let vazio = document.createElement("li");
                    vazio.className = "vazio";
                    vazio.innerText = "Nenhuma tarefa adicionada ainda";
                    lista.appendChild(vazio);
                }
            };

            // Adiciona os elementos ao item da lista
            li.appendChild(tarefaTexto);
            li.appendChild(botaoRemover);
            
            // Adiciona o item à lista
            lista.appendChild(li);

            // Limpa o campo de entrada
            input.value = "";
            
            // Foca novamente no campo de entrada
            input.focus();
            
            // Atualiza o contador
            atualizarContador();
        }
        
        function atualizarContador() {
            let lista = document.getElementById("lista");
            let contador = document.getElementById("contador");
            let itens = lista.querySelectorAll("li:not(.vazio)");
            contador.innerText = `Total de tarefas: ${itens.length}`;
        }
        
        // Permite adicionar tarefa pressionando Enter
        document.getElementById("tarefa").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                adicionarTarefa();
            }
        });
    </script>
</body>
</html>
