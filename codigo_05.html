<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
    <style>
        :root {
            --primary-color: #072f85;
            --secondary-color: #5122be;
            --accent-color: #328097;
            --danger-color: #8f2655;
            --light-color: #859cb4;
            --dark-color: #5b8ec2;
            --success-color: #65a761;
            --border-radius: 8px;
            --box-shadow: 0 4px 12px rgba(160, 35, 35, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: white;
            border-radius: var(--border-radius);
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: var(--box-shadow);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--secondary-color);
            font-size: 1.8rem;
            position: relative;
            padding-bottom: 10px;
        }

        .card h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: var(--accent-color);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark-color);
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5ee;
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .input-error {
            border-color: var(--danger-color);
        }

        .error-message {
            color: var(--danger-color);
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }

        .actions {
            margin-top: 25px;
            display: flex;
            gap: 12px;
            justify-content: space-between;
        }

        .actions button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: #e9ecef;
            color: var(--dark-color);
        }

        .btn-secondary:hover {
            background-color: #dee2e6;
            transform: translateY(-2px);
        }

        .success-message {
            background-color: var(--success-color);
            color: white;
            padding: 15px;
            border-radius: var(--border-radius);
            text-align: center;
            margin-top: 20px;
            display: none;
        }

        @media (max-width: 480px) {
            .card {
                padding: 20px;
            }
            
            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Cadastro</h2>
        <form id="formCadastro">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">
                <div class="error-message" id="nome-error">Por favor, preencha seu nome</div>
            </div>
            
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com">
                <div class="error-message" id="email-error">Por favor, insira um e-mail válido</div>
            </div>
            
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha segura">
                <div class="error-message" id="senha-error">A senha deve ter pelo menos 6 caracteres</div>
            </div>
            
            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
                <div class="error-message" id="telefone-error">Por favor, insira um telefone válido</div>
            </div>
            
            <div class="form-group">
                <label for="idade">Idade</label>
                <input type="number" id="idade" name="idade" placeholder="Sua idade" min="1" max="120">
                <div class="error-message" id="idade-error">Por favor, insira uma idade válida</div>
            </div>
            
            <div class="actions">
                <button type="button" class="btn-primary" onclick="enviarFormulario()">Cadastrar</button>
                <button type="button" class="btn-secondary" onclick="limparFormulario()">Limpar</button>
            </div>
        </form>
        
        <div class="success-message" id="success-message">
            Cadastro realizado com sucesso!
        </div>
    </div>

    <script>
        function validarFormulario() {
            let isValid = true;
            
            // Limpar erros anteriores
            document.querySelectorAll('.error-message').forEach(el => {
                el.style.display = 'none';
            });
            document.querySelectorAll('input').forEach(el => {
                el.classList.remove('input-error');
            });
            
            // Validar nome
            const nome = document.getElementById("nome").value.trim();
            if (nome === "") {
                document.getElementById("nome-error").style.display = 'block';
                document.getElementById("nome").classList.add('input-error');
                isValid = false;
            }
            
            // Validar email
            const email = document.getElementById("email").value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById("email-error").style.display = 'block';
                document.getElementById("email").classList.add('input-error');
                isValid = false;
            }
            
            // Validar senha
            const senha = document.getElementById("senha").value;
            if (senha.length < 6) {
                document.getElementById("senha-error").style.display = 'block';
                document.getElementById("senha").classList.add('input-error');
                isValid = false;
            }
            
            // Validar telefone
            const telefone = document.getElementById("telefone").value.trim();
            const telefoneRegex = /^\(?\d{2}\)?[\s-]?\d{4,5}-?\d{4}$/;
            if (!telefoneRegex.test(telefone)) {
                document.getElementById("telefone-error").style.display = 'block';
                document.getElementById("telefone").classList.add('input-error');
                isValid = false;
            }
            
            // Validar idade
            const idade = document.getElementById("idade").value;
            if (idade === "" || idade < 1 || idade > 120) {
                document.getElementById("idade-error").style.display = 'block';
                document.getElementById("idade").classList.add('input-error');
                isValid = false;
            }
            
            return isValid;
        }

        function limparFormulario() {
            document.getElementById("formCadastro").reset();
            
            // Limpar mensagens de erro
            document.querySelectorAll('.error-message').forEach(el => {
                el.style.display = 'none';
            });
            document.querySelectorAll('input').forEach(el => {
                el.classList.remove('input-error');
            });
            
            // Esconder mensagem de sucesso
            document.getElementById("success-message").style.display = 'none';
        }

        function enviarFormulario() {
            if (validarFormulario()) {
                // Simulação de envio
                document.getElementById("success-message").style.display = 'block';
                
                // Aqui poderia ter código para enviar via fetch/XHR
                setTimeout(() => {
                    document.getElementById("success-message").style.display = 'none';
                    limparFormulario();
                }, 3000);
            }
        }
    </script>
</body>
</html>
